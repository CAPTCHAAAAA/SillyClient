name: Build SillyClient iOS (Xcode & Simulator Verification)

on:
  push:
    branches: [ main, feature/sillyclient-ios ]
  workflow_dispatch:

jobs:
  build-and-simulate:
    runs-on: macos-14

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 编译 React 控制台前端
        run: |
          cd web/capacitor-ui
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: 准备 NodeMobile.xcframework 进程内运行时
        run: |
          echo "=== 下载 NodeMobile v18.20.4 官方预编译 XCFramework ==="
          curl -L -s -o nodejs-mobile-v18.20.4-ios.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-ios.zip
          unzip -q nodejs-mobile-v18.20.4-ios.zip
          mv NodeMobile.xcframework native-src/
          echo "=== 验证 NodeMobile.xcframework 结构 ==="
          ls -la native-src/NodeMobile.xcframework

      - name: 准备 SillyTavern 官方完整服务与生产依赖
        run: |
          echo "=== 正在克隆官方 SillyTavern 仓库 ==="
          git clone --depth 1 https://github.com/SillyTavern/SillyTavern.git sillytavern-src
          cd sillytavern-src
          echo "=== 安装纯 JS 生产依赖 (跳过原生构建脚本) ==="
          npm install --omit=dev --no-optional --ignore-scripts
          echo "=== 注入 NodeMobile (iOS small-icu) 兼容性补丁与懒加载适配 ==="
          node ../native-src/patch-sillytavern.mjs ./
          echo "=== 预设官方 config.yaml (禁用浏览器自启与 LAN 暴露) ==="
          cp default/config.yaml config.yaml
          node -e "
            const fs = require('fs');
            let c = fs.readFileSync('config.yaml', 'utf8');
            c = c.replace(/listen:\s*true/g, 'listen: false');
            c = c.replace(/browserLaunch:\s*\n\s*enabled:\s*true/g, 'browserLaunch:\n  enabled: false');
            fs.writeFileSync('config.yaml', c);
            console.log('--- 验证 config.yaml ---');
            console.log(c.slice(0, 300));
          "
          echo "=== 预编译 Webpack 静态资源 (生成 dist/_webpack 产物) ==="
          node -e "
            process.env.ST_DISABLE_SHARP = 'true';
            import('./src/middleware/webpack-serve.js').then(async m => {
              console.log('Building webpack dist/_webpack ahead-of-time...');
              await m.default().runWebpackCompiler({ forceDist: true });
              console.log('Webpack ahead-of-time build complete!');
              process.exit(0);
            }).catch(err => {
              console.error('Webpack pre-build warning:', err);
              process.exit(0);
            });
          "
          echo "=== 预置必要的空目录以杜绝 iOS 只读限制 ==="
          mkdir -p backups/_migration
          mkdir -p data/_storage
          mkdir -p data/_errors
          mkdir -p data/default-user
          cp ../native-src/ios-loader.mjs ./
          cp ../native-src/patch-sillytavern.mjs ./
          rm -rf .git
          cd ..
          echo "=== SillyTavern 服务端就绪 (含 public 官方前端) ==="
          ls -la sillytavern-src/public/

      - name: 初始化 Capacitor iOS 原生工程
        run: |
          cd web/capacitor-ui
          npx cap add ios
          npx cap sync ios

      - name: 配置 CocoaPods 与注入 SillyClientCore 原生套件
        run: |
          # 覆盖 Info.plist 与 AppDelegate.swift
          cp native-src/Info.plist web/capacitor-ui/ios/App/App/Info.plist
          cp native-src/AppDelegate.swift web/capacitor-ui/ios/App/App/AppDelegate.swift

          # 确保 App/capacitor.config.json 包含 TarvenEnvPlugin 原生插件定义
          node -e "
            const fs = require('fs');
            const targetPath = 'web/capacitor-ui/ios/App/App/capacitor.config.json';
            if (fs.existsSync(targetPath)) {
              const cfg = JSON.parse(fs.readFileSync(targetPath, 'utf8'));
              cfg.packageClassList = ['TarvenEnvPlugin', 'SillyClientCore.TarvenEnvPlugin'];
              fs.writeFileSync(targetPath, JSON.stringify(cfg, null, 2));
              console.log('--- 验证已注入 packageClassList 到 App capacitor.config.json ---');
              console.log(fs.readFileSync(targetPath, 'utf8'));
            }
          "

          # 用 Node.js 精确修改 Podfile，杜绝 sed 跨平台转义问题并验证绝对路径
          node -e "
            const fs = require('fs');
            const file = 'web/capacitor-ui/ios/App/Podfile';
            let content = fs.readFileSync(file, 'utf8');
            content = content.replace(\"target 'App' do\", \"target 'App' do\n  pod 'SillyClientCore', :path => '../../../../native-src'\");
            fs.writeFileSync(file, content);
            console.log('--- 验证修改后的 Podfile ---');
            console.log(content);
          "

          # 安装 CocoaPods 依赖 (包含 NodeMobile 框架自动签名与链接)
          cd web/capacitor-ui/ios/App
          pod install

      - name: Xcode 全量编译 (Release - arm64 真实设备二进制)
        run: |
          cd web/capacitor-ui/ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: 封装万能签标准免越狱 .ipa 安装包 (内置 SillyTavern 完整包)
        run: |
          cd web/capacitor-ui/ios/App
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/SillyClient.app
          # 将 SillyTavern 完整服务打入 Payload 应用包
          cp -r "$GITHUB_WORKSPACE/sillytavern-src" build/Payload/SillyClient.app/sillytavern
          cd build
          zip -qr "$GITHUB_WORKSPACE/SillyClient-iOS-v1.9.1-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"

      - name: Xcode 编译模拟器版并开机真机截图
        run: |
          # 挑选具有灵动岛的真机模拟器 (iPhone 15 Pro 或 14 Pro)
          echo "=== 可用 iOS 模拟器列表 ==="
          xcrun simctl list devices available
          
          DEVICE_UUID=$(xcrun simctl list devices available | grep -E "iPhone (15 Pro|14 Pro|16 Pro|15)" | head -n 1 | grep -E -o "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          if [ -z "$DEVICE_UUID" ]; then
            DEVICE_UUID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | grep -E -o "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          fi
          echo "=== 选定测试模拟器 UUID: $DEVICE_UUID ==="

          cd web/capacitor-ui/ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination "id=$DEVICE_UUID" \
                     -derivedDataPath build/derived \
                     build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY=""
          cd "$GITHUB_WORKSPACE"

          APP_PATH=$(find web/capacitor-ui/ios/App/build/derived -name "App.app" -type d | head -n 1)
          echo "Found APP_PATH: $APP_PATH"

          # 将 SillyTavern 完整服务打入模拟器 App Bundle
          cp -r sillytavern-src "$APP_PATH/sillytavern"
          echo "=== 验证 App Bundle 内 sillytavern 结构 ==="
          ls -la "$APP_PATH/sillytavern"

          # 运行全自动 E2E 演练脚本，按时序自动操作并抓取 5 大阶段真机截图与生成报告
          node scripts/run-ios-e2e.mjs "$DEVICE_UUID" "$APP_PATH"

      - name: 上传构建包 Artifact (真机可直接安装的完整 IPA)
        uses: actions/upload-artifact@v4
        with:
          name: SillyClient-iOS-v1.9.1-IPA
          path: SillyClient-iOS-v1.9.1-unsigned.ipa

      - name: 上传 E2E 自动化测试全流程阶段截图与可视化报告
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-evidence
          path: evidence/
