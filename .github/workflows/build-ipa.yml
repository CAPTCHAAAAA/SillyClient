name: Build SillyClient iOS (Xcode & Simulator Verification)

on:
  push:
    branches: [ main, feature/sillyclient-ios ]
  workflow_dispatch:

jobs:
  build-and-simulate:
    runs-on: macos-14

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 编译 React 控制台前端
        run: |
          cd web/capacitor-ui
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: 初始化 Capacitor iOS 原生工程
        run: |
          cd web/capacitor-ui
          npx cap add ios
          npx cap sync ios

      - name: 配置 CocoaPods 与注入 SillyClientCore 原生套件
        run: |
          # 覆盖 Info.plist 与 AppDelegate.swift
          cp native-src/Info.plist web/capacitor-ui/ios/App/App/Info.plist
          cp native-src/AppDelegate.swift web/capacitor-ui/ios/App/App/AppDelegate.swift

          # 用 Node.js 精确修改 Podfile，杜绝 sed 跨平台转义问题并验证绝对路径
          node -e "
            const fs = require('fs');
            const file = 'web/capacitor-ui/ios/App/Podfile';
            let content = fs.readFileSync(file, 'utf8');
            content = content.replace(\"target 'App' do\", \"target 'App' do\n  pod 'SillyClientCore', :path => '../../../../native-src'\");
            fs.writeFileSync(file, content);
            console.log('--- 验证修改后的 Podfile ---');
            console.log(content);
          "

          # 安装 CocoaPods 依赖
          cd web/capacitor-ui/ios/App
          pod install

      - name: Xcode 全量编译 (Release - arm64 真实设备二进制)
        run: |
          cd web/capacitor-ui/ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: 封装万能签标准免越狱 .ipa 安装包
        run: |
          cd web/capacitor-ui/ios/App
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/SillyClient.app
          cd build
          zip -qr ../../../../../SillyClient-iOS-v1.9.1-unsigned.ipa Payload
          cd ../../../..

      - name: Xcode 编译模拟器版并开机真机截图
        run: |
          cd web/capacitor-ui/ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
                     -derivedDataPath build/derived \
                     build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY=""
          cd ../../..

          DEVICE_UUID=$(xcrun simctl list devices "iPhone 16 Pro" | grep -v "unavailable" | grep -E -o "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}" | head -n 1)
          echo "Booting Simulator: $DEVICE_UUID"
          xcrun simctl boot "$DEVICE_UUID" || true
          sleep 5

          APP_PATH=$(find web/capacitor-ui/ios/App/build/derived -name "App.app" -type d | head -n 1)
          if [ -d "$APP_PATH" ]; then
            echo "Installing $APP_PATH to $DEVICE_UUID"
            xcrun simctl install "$DEVICE_UUID" "$APP_PATH"
            xcrun simctl launch "$DEVICE_UUID" com.sillyclient.ios || true
            sleep 6
          fi

          mkdir -p evidence
          xcrun simctl io "$DEVICE_UUID" screenshot evidence/iphone16pro-real-render.png

      - name: 上传构建包 Artifact (真机可直接安装的完整 IPA)
        uses: actions/upload-artifact@v4
        with:
          name: SillyClient-iOS-v1.9.1-IPA
          path: SillyClient-iOS-v1.9.1-unsigned.ipa

      - name: 上传灵动岛真机实测截图
        uses: actions/upload-artifact@v4
        with:
          name: iphone16pro-screenshot
          path: evidence/iphone16pro-real-render.png
