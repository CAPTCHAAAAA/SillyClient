<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>SillyClient 酒馆启动器</title>
    <script>
      if (window.parent !== window && new URLSearchParams(window.location.search).get("onboardingSandbox") === "1") {
        var policy = document.createElement("meta");
        policy.httpEquiv = "Content-Security-Policy";
        policy.content = "connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'";
        document.head.appendChild(policy);
        ["localStorage", "sessionStorage"].forEach(function(name) {
          var values = new Map();
          Object.defineProperty(window, name, {
            configurable: true,
            value: {
              get length() { return values.size; },
              clear: function() { values.clear(); },
              getItem: function(key) { return values.get(String(key)) ?? null; },
              key: function(index) { return Array.from(values.keys())[index] ?? null; },
              removeItem: function(key) { values.delete(String(key)); },
              setItem: function(key, value) { values.set(String(key), String(value)); }
            }
          });
        });
      }
    </script>

    <style>
      /* 内联样式确保主题色立即生效，避免闪烁 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      html.light, html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark, html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }
    </style>
    <script>
      // 本地运行：直接读取 localStorage 或系统偏好设置主题
      (function() {
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        }

        var stored = localStorage.getItem('theme');
        if (stored === 'dark' || stored === 'light') {
          applyThemeToDOM(stored);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          applyThemeToDOM('dark');
        } else {
          applyThemeToDOM('light');
        }
      })();
    </script>
